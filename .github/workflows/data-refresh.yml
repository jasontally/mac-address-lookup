name: Data refresh

# Runs daily: hashes the upstream sources, and commits a refresh-date bump only
# when something changed upstream (or once a month, to keep indexed pages
# current). No-op days cost ~30s of workflow time and zero build minutes because
# no commit is made. The commit triggers a Cloudflare Workers Build. Pushes made
# with GITHUB_TOKEN do not start other Actions workflows, but they do reach
# GitHub Apps such as Cloudflare's.

on:
  schedule:
    # Daily at 06:23 UTC
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Force a refresh even when sources are unchanged
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Check data sources
        run: node build/check-sources.mjs ${{ inputs.force == true && '--force' || '' }}

      - name: Commit the refresh trigger
        run: |
          if git diff --quiet -- data/refresh.txt; then
            echo "No refresh needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/refresh.txt
          git commit -m "chore: data refresh $(date -u +%F)"
          git push
